# Transformer Model Configuration
model:
  vocab_size: 32000
  d_model: 512
  num_heads: 16
  num_layers: 4
  d_ff: 1344
  context_length: 256
  theta: 10000
  dropout: 0

# Data Loading Configuration
data:
  train_data_path: "data/tinystories_train.npy"
  valid_data_path: "data/tinystories_valid.npy"  # Set to data path for validation
  batch_size: 64
  context_length: 256
  num_workers: 10
  pin_memory: true
  shuffle: true

# Optimizer Configuration
optimizer:
  name: "adamw"  # Options: adamw, adam, sgd
  lr: 1e-3
  betas: [0.9, 0.999]
  weight_decay: 0.01
  eps: 1e-8

# Learning Rate Scheduler Configuration
scheduler:
  name: "cosine"  # Options: cosine, constant, linear, exponential
  lr_max: 1e-3
  lr_min: 0.0
  warmup_steps: 200
  total_steps: 10000

# Training Loop Configuration
training:
  max_epochs: 1
  max_steps: 10000  # Set to override max_epochs
  gradient_accumulation_steps: 1
  gradient_clip_val: 1.0  # Set to null to disable
  val_check_interval: 4999
  max_val_batches: 500  # Set to null to run the full validation set
  save_interval: 1000
  log_interval: 10
  device: "mps"  # Options: cuda, cpu
  dtype: "bfloat16"  # Options: float32, float16, bfloat16
  seed: 42

# Checkpoint Configuration
checkpoint:
  checkpoint_dir: "checkpoints"
  save_best_only: false
  resume_from_checkpoint: null
  keep_last_n: 3


experiment_tracking:
  enabled: true
  backend: "wandb,tensorboard"
  project_name: "cs336-basics"
  experiment_name: "transformer-lm-training"
  run_name: "run-002"
  tags:
    model: "transformer"
    dataset: "tinystories"
    version: "v1"
  notes: "Training a transformer language model on TinyStories dataset"
  wandb_entity: null
  mlflow_tracking_uri: null
  tensorboard_dir: "runs"
  log_interval: 10
  log_model: false
  log_gradients: false
